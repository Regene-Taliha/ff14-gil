<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hades 金策リスト</title>
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#17252c;--sub:#5d6b73;--line:#d5dce1;--accent:#0f4c5c;--on:#fff;--gil:#9a6a14}
@media (prefers-color-scheme:dark){:root{--bg:#111a1e;--panel:#1a272d;--ink:#e6edf0;--sub:#9aabb3;--line:#2c3c44;--accent:#5fb3c7;--on:#0c1418;--gil:#e0a94a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif}
main{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.lvs{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 14px 6px}
.lvs summary{cursor:pointer;font-weight:600;padding:12px 0}
.lvs[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}
.grp{font-size:12px;color:var(--sub);margin:10px 0 2px}
.lvrow{flex-direction:row;justify-content:space-between;align-items:center;color:var(--ink);font-size:15px;padding:3px 0}
.lvrow input{width:76px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--sub);margin:0 0 20px;font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
select,input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:38px}
input[type=number]{width:90px}
button{font:inherit;font-weight:600;background:var(--accent);color:var(--on);border:0;border-radius:6px;padding:8px 20px;min-height:38px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:2px solid var(--gil);outline-offset:2px}
#st{margin:14px 2px;color:var(--sub);font-size:13px;min-height:20px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--sub);font-weight:600}
td:nth-child(1),th:nth-child(1){text-align:center;width:44px;color:var(--sub)}
td:nth-child(2),th:nth-child(2){text-align:left;white-space:normal}
td.g{color:var(--gil);font-weight:600}
tr:last-child td{border-bottom:0}
</style>
</head>
<body>
<main>
<h1>Hades 金策リスト</h1>
<p class="sub">Mana / Hades のマーケット相場から、そのレベルで採集・製作できる売れ筋アイテムを20件表示します。</p>

<div class="layout">
<details class="lvs" open>
  <summary>レベル設定</summary>
  <div id="lvlist"></div>
</details>
<section>
<div class="bar">
  <label>検索するクラス<select id="job"></select></label>
  <label>並び順<select id="sort">
    <option value="turn">1日の売上が大きい順</option>
    <option value="vel">販売数が多い順</option>
  </select></label>
  <button id="go" disabled>検索</button>
</div>
<div id="st">読み込み中…</div>
<div class="wrap" id="res" hidden>
  <table>
    <thead><tr><th>#</th><th>アイテム</th><th>平均売価</th><th>最安値</th><th>1日販売数</th><th>1日売上</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
</section>
</div>
</main>

<script>
const WORLD = "Hades";
const JOBS = {
  CRP:"木工師",BSM:"鍛冶師",ARM:"甲冑師",GSM:"彫金師",LTW:"革細工師",WVR:"裁縫師",ALC:"錬金術師",CUL:"調理師",
  MIN:"採掘師",BTN:"園芸師",FSH:"漁師"
};
const TTL = 10 * 60e3;
const $ = id => document.getElementById(id);
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k) ?? "null") ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const yen = n => Math.round(n).toLocaleString("ja-JP");

let DB;
const levels = load("levels", {});

// 画面の初期化
for (const [k, n] of Object.entries(JOBS)) $("job").add(new Option(n, k));
$("job").value = load("job", "CRP");
$("job").onchange = () => save("job", $("job").value);

const GROUPS = [["クラフター", ["CRP","BSM","ARM","GSM","LTW","WVR","ALC","CUL"]], ["ギャザラー", ["MIN","BTN","FSH"]]];
$("lvlist").innerHTML = GROUPS.map(([t, js]) => `<div class="grp">${t}</div>` + js.map(k =>
  `<label class="lvrow">${JOBS[k]}<input type="number" min="1" max="100" data-j="${k}" value="${levels[k] ?? 1}"></label>`).join("")).join("");
$("lvlist").oninput = e => {
  const k = e.target.dataset.j;
  if (k) { levels[k] = Math.min(100, Math.max(1, +e.target.value || 1)); save("levels", levels); }
};

fetch("items.json").then(r => r.json()).then(d => {
  DB = d; $("go").disabled = false; $("st").textContent = "クラスとレベルを選んで、検索を押してください。";
}).catch(() => { $("st").textContent = "items.json を読み込めませんでした。index.html と同じ場所に置いてください。"; });

// Universalis（相場）取得。10分間はブラウザに保存した結果を使う
function reduce(r) {
  const q = (g, f) => r[g]?.[f]?.world;
  const vn = q("nq","dailySaleVelocity")?.quantity ?? 0, vh = q("hq","dailySaleVelocity")?.quantity ?? 0;
  const an = q("nq","averageSalePrice")?.price ?? 0, ah = q("hq","averageSalePrice")?.price ?? 0;
  const v = vn + vh, avg = v > 0 ? (an * vn + ah * vh) / v : 0;
  const mins = [q("nq","minListing")?.price, q("hq","minListing")?.price].filter(Boolean);
  return [r.itemId, Math.round(avg), +v.toFixed(2), mins.length ? Math.min(...mins) : 0];
}
async function market(ids) {
  const key = `mk:${ids[0]}-${ids.at(-1)}-${ids.length}`;
  const c = load(key, null);
  if (c && Date.now() - c.t < TTL) return c.d;
  const res = await fetch(`https://universalis.app/api/v2/aggregated/${WORLD}/${ids.join(",")}`);
  if (!res.ok) throw new Error(res.status);
  const d = (await res.json()).results.map(reduce);
  try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d })); }
  catch { Object.keys(localStorage).filter(k => k.startsWith("mk:")).forEach(k => localStorage.removeItem(k)); }
  return d;
}

// 検索
$("go").onclick = async () => {
  const job = $("job").value, lv = levels[job] ?? 1;
  const ids = [...new Set((DB.craft[job] ?? DB.gather[job] ?? []).filter(([l]) => l <= lv).map(([, i]) => i))];
  if (!ids.length) { $("st").textContent = "該当するアイテムがありません。"; return; }
  $("go").disabled = true; $("res").hidden = true;
  const all = [];
  try {
    for (let i = 0; i < ids.length; i += 100) {
      $("st").textContent = `相場を取得中… ${Math.min(i + 100, ids.length)} / ${ids.length}`;
      all.push(...await market(ids.slice(i, i + 100)));
    }
  } catch (e) {
    $("st").textContent = "相場を取得できませんでした。少し待ってからもう一度検索してください。";
    $("go").disabled = false; return;
  }
  const list = all
    .filter(([, avg, v, min]) => v >= 1 && avg > 0 && !(min && avg / min >= 50))
    .map(([id, avg, v, min]) => ({ id, avg, v, min, turn: avg * v }))
    .sort((a, b) => $("sort").value === "vel" ? b.v - a.v : b.turn - a.turn)
    .slice(0, 20);
  $("rows").innerHTML = list.map((x, i) =>
    `<tr><td>${i + 1}</td><td>${DB.names[x.id] ?? x.id}</td><td>${yen(x.avg)}</td><td>${x.min ? yen(x.min) : "-"}</td><td>${x.v.toFixed(1)}</td><td class="g">${yen(x.turn)}</td></tr>`
  ).join("");
  $("res").hidden = !list.length;
  $("st").textContent = list.length
    ? `${JOBS[job]} Lv${lv} 以下の対象 ${ids.length} 件から、売れ筋 ${list.length} 件を表示しています。`
    : "1日1個以上売れているアイテムが見つかりませんでした。";
  $("go").disabled = false;
};
</script>
</body>
</html>
